<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart-Filter &mdash; Search blocked</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            background: #fff; border-radius: 14px; padding: 32px; max-width: 480px; width: 100%;
            box-shadow: 0 20px 60px rgba(49,46,129,.35);
        }
        .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .brand img { width: 26px; height: 26px; }
        .brand strong { font-size: 14px; color: #4f46e5; letter-spacing: .02em; }
        .badge {
            display: inline-block; padding: 4px 12px; border-radius: 20px; color: #fff;
            font-weight: 700; font-size: 12px; letter-spacing: .5px; margin-bottom: 12px;
        }
        .badge.blocked { background: #dc3545; }
        .badge.error { background: #e0a800; color: #333; }
        h1 { font-size: 22px; color: #333; margin-bottom: 8px; }
        p { color: #555; line-height: 1.6; margin-bottom: 12px; font-size: 14px; }
        #queryLine { font-family: monospace; background: #f5f5f5; padding: 10px; border-radius: 6px;
                     overflow-wrap: anywhere; color: #222; }
        #detail { font-size: 13px; color: #444; margin: 8px 0 16px; line-height: 1.6; }
        #detail .k { color: #6b7280; }
        .actions { display: flex; gap: 10px; margin-top: 8px; }
        button {
            flex: 1; padding: 11px 16px; border: none; border-radius: 9px; font-size: 14px;
            font-weight: 600; cursor: pointer;
        }
        .primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
        .ghost { background: #f0f0f0; color: #333; }
        .foot { font-size: 12px; color: #999; margin-top: 18px; line-height: 1.5; }
        code { background: #f1f2f6; padding: 1px 5px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand"><img src="../icons/icon48.png" alt=""><strong>Smart-Filter</strong></div>
        <div class="badge blocked" id="badge">BLOCKED</div>
        <h1 id="headline">Search blocked</h1>
        <p id="sub">This search was blocked by your Smart-Filter policy.</p>
        <p id="queryLine"></p>
        <div id="detail"></div>
        <div class="actions">
            <button class="ghost" id="goBack">Go back</button>
            <button class="primary" id="retry" hidden>Retry search</button>
        </div>
        <p class="foot" id="foot"></p>
    </div>
    <script src="blocked.js"></script>
</body>
</html>
